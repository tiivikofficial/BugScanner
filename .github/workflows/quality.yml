name: BugScanner Quality Gate

on:
  push:
    branches: ["feat/poc-complete-platform"]
  pull_request:
    branches: ["feat/poc-complete-platform"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Compile Python modules
        run: python -m compileall -q core modules cli.py

      - name: Run tests
        run: pytest -q
